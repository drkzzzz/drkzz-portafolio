services:
  drkzz-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    image: drkzz-portfolio:local
    container_name: drkzz-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8085}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz.txt || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
